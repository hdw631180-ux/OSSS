<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>archweb — Arch Linux dans le navigateur</title>
<meta name="theme-color" content="#14052b"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%2314052b' stroke='%23ff3d9a' stroke-width='2.5'/%3E%3Cpath d='M21.5 9H11.5V23H21.5M11.5 16H19.5' fill='none' stroke='%23ff3d9a' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#000000;--fg:#e9e3f2;--ac:#ff3d9a;--dim:#8f7aa8;--bd:#3a1d5c;--red:#ff5c8a;--grn:#35e0d0;--ylw:#ffb347;--tkh:50px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);-webkit-font-smoothing:antialiased;color:var(--fg);font:13px/1.4 ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;overflow:hidden}
#boot{position:fixed;inset:0;z-index:9;background:#000;color:#bbb;padding:16px;white-space:pre-wrap;overflow:hidden}
#boot .ok{color:var(--grn)}
#desk{display:flex;flex-direction:column;height:100%}
#bar{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;background:#000000;border-bottom:1px solid var(--bd);flex:none;white-space:nowrap}
#bar .w{padding:2px 9px;border-radius:3px;color:var(--dim);cursor:pointer}
#bar .w.has{color:var(--fg)}
#bar .w.on{background:var(--ac);color:#04121b;font-weight:700}
#bar .t{flex:1;text-align:center;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
#bar .b{border:1px solid var(--bd);background:none;color:var(--fg);font:inherit;padding:1px 8px;border-radius:3px;cursor:pointer}
#bar .b:hover{border-color:var(--ac);color:var(--ac)}
#bar .logo{display:flex;align-items:center;gap:6px;color:var(--ac);font-weight:700;padding-right:4px}
#area{position:relative;flex:1;margin:6px;min-height:0}
.win{position:absolute;display:none;flex-direction:column;background:#000000;border:2px solid var(--bd);border-radius:4px;overflow:hidden}
.win.f{border-color:var(--ac)}
.tb{display:flex;justify-content:space-between;padding:2px 8px;font-size:11px;background:#000000;color:var(--dim);flex:none}
.tb .x{cursor:pointer;font-size:14px;line-height:1}
.tb .x:hover{color:var(--red)}
.bd{flex:1;overflow:auto;padding:8px;white-space:pre-wrap;word-break:break-word}
.ln{display:flex}
.ln input{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit;caret-color:var(--ac)}
.a{color:var(--ac)}.g{color:var(--grn)}.r{color:var(--red)}.y{color:var(--ylw)}.d{color:var(--dim)}
.wiki h2{margin:0 0 6px;color:var(--ac);font-size:16px}
.wiki h3{margin:14px 0 4px;color:var(--ylw);font-size:13px}
.wiki{white-space:normal;max-width:72ch}
.wiki kbd{border:1px solid var(--bd);background:#000000;border-radius:3px;padding:0 5px;color:var(--grn)}
.wiki code{color:var(--ac)}
.wiki p,.wiki li{margin:3px 0}
.wiki ul{padding-left:18px;margin:4px 0}
#desk{position:relative}
#dock,#lc,#bat{display:none}
.mk{width:18px;height:18px;vertical-align:middle}
.tb b{cursor:pointer;width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-size:13px}
.tb .m,.tb .mx{display:none}
.toast{position:fixed;top:40px;right:14px;z-index:999999;background:#000000f0;border:1px solid #ffffff22;border-left:3px solid var(--ac);padding:10px 14px;border-radius:8px;color:#e2e8f0;font:13px system-ui;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateX(20px)}}
.app{white-space:normal!important;padding:0!important;font:13px system-ui;color:#e2e8f0}
.fm{display:grid;grid-template-columns:140px 1fr 1fr;height:100%}
.fs{border-right:1px solid #ffffff14;padding:8px}.fl{overflow:auto;padding:8px}
.fi,.fe{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.fi:hover,.fe:hover{background:#ffffff10}.fi.on,.fe.on{background:color-mix(in srgb,var(--ac) 30%,transparent)}
.fv{padding:12px;white-space:pre-wrap;border-left:1px solid #ffffff14;font:12px ui-monospace,monospace;overflow:auto}
.fp{color:var(--dim);padding:2px 8px 8px}.up{cursor:pointer;color:var(--ac);margin-right:6px}
.st{padding:16px}.st h2{margin:0 0 4px}
.st h3{margin:16px 0 8px;font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em}
.sr{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff10}.sr>div{flex:1}
.st button{background:var(--ac);color:#04121b;border:0;border-radius:8px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
.st button.rm{background:#ffffff18;color:#e2e8f0}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw i{width:56px;height:36px;border-radius:8px;border:2px solid #ffffff30;cursor:pointer}.sw i:hover{border-color:#fff}
.sw i[data-a]{width:30px;height:30px;border-radius:50%}
#dock{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);gap:10px;padding:8px 12px;background:#000000b3;backdrop-filter:blur(18px);border:1px solid #ffffff1c;border-radius:20px;z-index:99998;align-items:center;box-shadow:0 10px 40px #000a}
.dk{position:relative;cursor:pointer;transition:transform .12s ease-out;transform-origin:50% 100%}
@keyframes bnc{0%,100%{transform:translateY(0)}30%{transform:translateY(-24px)}55%{transform:translateY(0)}72%{transform:translateY(-10px)}}
.dk.bounce{animation:bnc .8s ease}
.dk svg{display:block}.dk .mk{width:46px;height:46px;padding:8px;background:#ffffff12;border-radius:12px}
.dk.run::after{content:"";position:absolute;left:50%;bottom:-6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}
.sep{width:1px;height:34px;background:#ffffff22;margin:0 4px}
#lc{position:absolute;inset:30px 0 0 0;z-index:100000;background:#000000cc;backdrop-filter:blur(22px);flex-direction:column;align-items:center;padding:56px 16px;gap:28px}
#lc.open{display:flex}
#lc input{width:min(440px,90%);background:#ffffff14;border:1px solid #ffffff22;border-radius:12px;padding:12px 16px;color:#fff;font:15px system-ui;outline:0}
#lcg{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;max-width:560px}
.ap{width:92px;text-align:center;cursor:pointer;font:12px system-ui;color:#e2e8f0}.ap svg{display:block;margin:0 auto 6px;transition:transform .15s}.ap:hover svg{transform:scale(1.1)}
body.winmode #desk{background:var(--wp)}
body.winmode #area{margin-bottom:84px}
body.winmode #bat{display:inline}
body.winmode #bar{height:30px;background:#000000cc;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff12}
body.winmode #bar .logo,body.winmode #bar .b[data-sp],body.winmode #pk{display:none}
body.winmode #bar .w.start{display:flex;align-items:center;gap:7px;padding:2px 10px;background:#ffffff10;color:#fff;border-radius:8px}
body.winmode .win{background:#000000ee;backdrop-filter:blur(18px);border-radius:12px;border:1px solid #ffffff1f;box-shadow:0 18px 50px #000a;resize:both;min-width:260px;min-height:140px}
body.winmode .win.f{border-color:var(--ac);box-shadow:0 18px 50px #000c,0 0 0 1px var(--ac)}
body.winmode .tb{background:transparent;color:#cbd5e1;font:12px system-ui;padding:6px 8px 6px 14px;touch-action:none}
body.winmode .tb b{color:#94a3b8}body.winmode .tb b:hover{background:#ffffff18;color:#fff}
body.winmode .tb .x:hover{background:#ef4444;color:#fff}
body.winmode .tb .m,body.winmode .tb .mx{display:inline-grid}
@keyframes winIn{from{opacity:0;transform:scale(.88) translateY(14px)}60%{opacity:1;transform:scale(1.02)}to{transform:none}}
@keyframes winOut{to{opacity:0;transform:scale(.88)}}
@keyframes winMin{to{transform:translate(var(--tx),var(--ty)) scale(.08,.03);opacity:0;border-radius:60px}}
@keyframes winRs{from{transform:translate(var(--tx),var(--ty)) scale(.08,.03);opacity:0}}
@keyframes lcIn{from{opacity:0}}
@keyframes apIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
@keyframes drift{to{transform:translate(6%,4%) rotate(8deg)}}
.ap{animation:apIn .4s cubic-bezier(.2,.9,.3,1.2) both}
#lc.open{animation:lcIn .28s ease}
body.winmode .win{transition:box-shadow .25s,border-color .25s}
body.winmode .win.opening{animation:winIn .42s cubic-bezier(.2,.9,.3,1)}
body.winmode .win.closing{animation:winOut .22s ease-in forwards;pointer-events:none}
body.winmode .win.minimizing{animation:winMin .32s cubic-bezier(.5,0,.8,.4) forwards;pointer-events:none}
body.winmode .win.restoring{animation:winRs .36s cubic-bezier(.2,.9,.3,1)}
body.winmode .win.tr{transition:left .34s cubic-bezier(.3,.9,.3,1),top .34s cubic-bezier(.3,.9,.3,1),width .34s cubic-bezier(.3,.9,.3,1),height .34s cubic-bezier(.3,.9,.3,1)}
/* feux tricolores façon macOS */
body.winmode .tb{gap:10px;padding:11px 14px}
body.winmode .tb>span:last-child{order:-1;display:flex;gap:8px}
body.winmode .tb .tt{flex:1;text-align:center;margin-right:52px}
body.winmode .tb b{width:12px;height:12px;border-radius:50%;font-size:0;color:#0009!important;font-weight:700;line-height:1;transition:filter .15s,box-shadow .15s;box-shadow:inset 0 1px 0 #ffffff60,0 1px 3px #0006}
body.winmode .tb>span:last-child:hover b{font-size:10px}
body.winmode .tb b:hover{filter:brightness(1.15)}
body.winmode .tb b.x{order:1;background:#ff5f57!important}
body.winmode .tb b.m{order:2;background:#febc2e!important}
body.winmode .tb b.mx{order:3;background:#28c840!important}
/* ========== ARCHWEB VOID MESH — signature OS (plus glass générique) ========== */
body.winmode #desk{overflow:hidden;perspective:none;background:var(--wp)}
/* Fond mesh + bloom rouge discret */
body.winmode #desk::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(ellipse 70% 50% at 15% 10%,#ff3d9a22,transparent 55%),
  radial-gradient(ellipse 50% 40% at 90% 85%,#35e0d02a,transparent 55%),
  linear-gradient(#ff3d9a14 1px,transparent 1px),
  linear-gradient(90deg,#ff3d9a14 1px,transparent 1px);
  background-size:auto,auto,48px 48px,48px 48px;
  animation:meshPulse 12s ease-in-out infinite alternate}
@keyframes meshPulse{from{opacity:.85;filter:hue-rotate(0deg)}to{opacity:1;filter:hue-rotate(8deg)}}
body.winmode #desk::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(ellipse 100% 80% at 50% 50%,transparent 40%,#00000099 100%);
  box-shadow:inset 0 0 100px #000}

/* Barre — carbone + ligne néon */
body.winmode #bar{
  position:relative;z-index:5;
  background:#14072af2;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid #3a1d5c;
  box-shadow:0 1px 0 #ff3d9a33,0 8px 32px #0008;
}
body.winmode #bar::after{content:"";position:absolute;left:10%;right:10%;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,#ff3d9a88 30%,#ff6b7a 50%,#ff3d9a88 70%,transparent);opacity:.7}

/* Fenêtres — panneau void (mat, bord néon, lisible) */
body.winmode .win{
  background:#12061fee;
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  border:1px solid #4a2670;
  border-radius:14px;
  box-shadow:
    0 0 0 1px #000,
    0 12px 40px #000000aa,
    0 0 24px #ff3d9a12;
  transform:none;
  transition:box-shadow .25s,border-color .25s,transform .2s ease;
  resize:both;min-width:260px;min-height:140px;
}
body.winmode .win.f{
  border-color:color-mix(in srgb,var(--ac) 55%,#5b3390);
  box-shadow:
    0 0 0 1px color-mix(in srgb,var(--ac) 40%,transparent),
    0 16px 48px #000000cc,
    0 0 32px color-mix(in srgb,var(--ac) 22%,transparent),
    inset 0 1px 0 #ffffff12;
  transform:none;
}
body.winmode .win::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:linear-gradient(180deg,#ffffff0c 0%,transparent 28%);
  opacity:1;
}
body.winmode .win::after,#dock::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:linear-gradient(160deg,#ffffff35 0%,transparent 35%,transparent 65%,#ff3d9a30 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.7;
}

/* Dock — barre carbone */
#dock{
  background:#14072af5;
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border:1px solid #4a2670;
  border-radius:22px;
  box-shadow:0 12px 40px #000000a0,0 0 0 1px #000,0 0 20px #ff3d9a15;
  transform:translateX(-50%);
}
#dock .dk{transition:transform .2s cubic-bezier(.2,.9,.3,1.15)}
#dock .dk:hover{transform:translateY(-8px) scale(1.1)}
#dock .dk .mk{
  background:#1f0c36;
  box-shadow:inset 0 1px 0 #ffffff12,0 4px 12px #0006;
  border:1px solid #4a2670;border-radius:12px;
}

#lc{background:#0d0418ee;backdrop-filter:blur(30px)}
#lc input{background:#170a2a;border:1px solid #4a2670;border-radius:12px;box-shadow:none;color:#fff}
#lc input:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}

.toast{background:#170a2af5;backdrop-filter:blur(16px);border:1px solid #4a2670;border-left:3px solid var(--ac);border-radius:12px;box-shadow:0 12px 36px #000a}

.st button{background:var(--ac);border-radius:10px;border:1px solid #ffffff22;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 35%,transparent);color:#04121b}
.st button.rm{background:#25103d;color:#e2e8f0;border-color:#4a2670}

.di{border-radius:14px;transition:all .2s;border:1px solid transparent}
.di:hover{background:#ffffff0c;border-color:#ffffff18;transform:translateY(-3px);box-shadow:0 8px 24px #0008}
.di svg{filter:drop-shadow(0 4px 10px #0009)}

body.winmode #bar .b{background:#1f0c36;border:1px solid #4a2670;border-radius:8px;box-shadow:none;transition:all .15s;color:#c5c8c6}
body.winmode #bar .b:hover{border-color:var(--ac);color:#fff;background:#2a0f3f}
body.winmode #bar .w.start{background:#1f0c36;border:1px solid #4a2670;border-radius:8px}

body.winmode .bd,body.winmode .app{background:transparent;position:relative;z-index:3}
body.winmode .tb{background:#0e0418;border-bottom:1px solid #3a1d5c;backdrop-filter:none;position:relative;z-index:4}

#bar .b.syn{border-color:color-mix(in srgb,var(--ac) 50%,#4a2670);color:var(--ac)}
#snd.off{opacity:.4;text-decoration:line-through}
#dsk{display:none;position:absolute;left:14px;top:44px;z-index:1}
body.winmode #dsk{display:block}
body.dragging iframe{pointer-events:none}

/* Agents pixel art (style terminal / Claude Code) */
#novaPet,#orbitPet{display:none;position:absolute;z-index:99990;width:64px;height:80px;cursor:grab;
  image-rendering:pixelated;image-rendering:crisp-edges;
  filter:drop-shadow(0 8px 0 #00000066);
  transition:filter .15s;user-select:none;touch-action:none}
#novaPet{right:24px;bottom:88px}
#orbitPet{left:24px;bottom:88px}
body.winmode #novaPet,body.winmode #orbitPet{display:block}
#novaPet:active,#orbitPet:active{cursor:grabbing}
#novaPet:hover{filter:drop-shadow(0 8px 0 #00000066) drop-shadow(0 0 12px #e8a54b88)}
#orbitPet:hover{filter:drop-shadow(0 8px 0 #00000066) drop-shadow(0 0 12px #6b8f7188)}
#novaPet svg,#orbitPet svg{width:100%;height:100%;display:block;overflow:visible;shape-rendering:crispEdges}
#novaPet .bubble,#orbitPet .bubble{
  position:absolute;bottom:70px;max-width:160px;padding:6px 10px;
  background:#14072a;border:2px solid #fff;color:#fff;
  font:10px/1.3 ui-monospace,Menlo,Consolas,monospace;
  image-rendering:pixelated;white-space:normal;opacity:0;pointer-events:none;
  transition:opacity .15s;box-shadow:4px 4px 0 #00000088}
#novaPet .bubble{right:68px;border-color:#e8a54b}
#orbitPet .bubble{left:68px;border-color:#6b8f71}
#novaPet.show .bubble,#orbitPet.show .bubble{opacity:1}
#novaPet .ring,#orbitPet .ring{display:none}
@keyframes pixelBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#novaPet .body,#orbitPet .body{animation:pixelBob 1.2s steps(2) infinite}
#novaPet.busy .body,#orbitPet.busy .body{animation-duration:.4s}
@keyframes pixelBlink{0%,45%,55%,100%{opacity:1}50%{opacity:0}}
#novaPet .eye,#orbitPet .eye{animation:pixelBlink 3s steps(1) infinite}

/* Forge chat theme */
.ai-wrap.forge .ai-head .dot{background:#e8a54b;box-shadow:0 0 12px #e8a54b,0 0 24px #e8a54b55}
.ai-wrap.forge .ai-msg.user{background:linear-gradient(160deg,#e8a54bcc,#9a5b1a);box-shadow:0 6px 20px #e8a54b40,inset 0 1px 0 #ffffff40}
.ai-wrap.forge .ai-msg.bot .tag{color:#e8a54b}
.ai-wrap.forge .ai-msg.bot .tag::before{background:#e8a54b;box-shadow:0 0 8px #e8a54b}
.ai-wrap.forge .ai-foot button{background:linear-gradient(180deg,#f0c078,#9a5b1a);color:#1a1208;box-shadow:inset 0 1px 0 #ffffff90,0 4px 14px #e8a54b50}
.ai-wrap.forge .ai-sug button:hover{border-color:#e8a54b;background:#e8a54b28}
/* Scope chat theme */

.ai-wrap.orbit .ai-head .dot{background:#6b8f71;box-shadow:0 0 12px #6b8f71,0 0 24px #6b8f7155}
.ai-wrap.orbit .ai-msg.user{background:linear-gradient(160deg,#6b8f71cc,#2d4a34);box-shadow:0 6px 20px #6b8f7140,inset 0 1px 0 #ffffff40}
.ai-wrap.orbit .ai-msg.bot .tag{color:#6b8f71}
.ai-wrap.orbit .ai-msg.bot .tag::before{background:#6b8f71;box-shadow:0 0 8px #6b8f71}
.ai-wrap.orbit .ai-foot button{background:linear-gradient(180deg,#8fbc8f,#2d4a34);box-shadow:inset 0 1px 0 #ffffff90,0 4px 14px #6b8f7150;color:#0c1810}
.ai-wrap.orbit .ai-sug button:hover{border-color:#6b8f71;background:#6b8f7128}



@media (max-width:700px){#bar .hide{display:none}#dock{gap:6px;padding:6px 8px}.dk svg{width:36px;height:36px}.dk .mk{width:36px;height:36px;padding:5px}#bar{gap:4px}#bar .logo{font-size:0}#bar .b{padding:1px 6px}#clk{display:none}#novaPet{width:48px;height:60px;right:12px;bottom:72px}#orbitPet{width:48px;height:60px;left:12px;bottom:72px}}

/* Nova IA chat — v2 */
.ai-wrap{display:flex;flex-direction:column;height:100%;min-height:0;font:14px/1.5 system-ui,-apple-system,sans-serif;color:#e8eef6}
.ai-head{flex:none;padding:12px 16px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,#ffffff12,#ffffff04);backdrop-filter:blur(12px)}
.ai-head .dot{width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 12px var(--ac),0 0 24px color-mix(in srgb,var(--ac) 40%,transparent);animation:aiPulse 1.8s ease-in-out infinite}
@keyframes aiPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.ai-head b{font-weight:700;letter-spacing:.02em;font-size:14px}
.ai-head span{color:#94a3b8;font-size:12px}
.ai-head .ai-meta{margin-left:auto;font-size:11px;color:#64748b;font-variant-numeric:tabular-nums}
.ai-log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0;scroll-behavior:smooth}
.ai-msg{max-width:min(92%,520px);padding:11px 14px;border-radius:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
  animation:aiIn .28s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes aiIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.ai-msg.user{align-self:flex-end;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 60%,#fff3),color-mix(in srgb,var(--ac) 85%,#000));
  color:#fff;border:1px solid #ffffff30;box-shadow:0 6px 20px color-mix(in srgb,var(--ac) 28%,transparent),inset 0 1px 0 #ffffff40}
.ai-msg.bot{align-self:flex-start;background:linear-gradient(160deg,#ffffff1a,#ffffff08);
  border:1px solid #ffffff22;backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 #ffffff35,0 4px 16px #0004}
.ai-msg.bot .tag{display:inline-flex;align-items:center;gap:5px;font:10px ui-monospace,Menlo,Consolas,monospace;color:var(--ac);margin-bottom:6px;letter-spacing:.04em;font-weight:700}
.ai-msg.bot .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.ai-msg.think{opacity:.7;font-style:italic}

<script>
const $=s=>document.querySelector(s);
window.addEventListener('error',e=>{try{const t=document.createElement('div');t.className='toast';t.textContent='Erreur: '+(e.message||'js');document.body.append(t);setTimeout(()=>t.remove(),5000)}catch(x){}});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T0=Date.now();

/* ---------- système de fichiers virtuel ---------- */
const fs={
  home:{user:{
    'readme.md':'# archweb\nBienvenue. Tape `help`.\nKeep it simple, btw.',
    '.bashrc':'alias ll="ls -la"\nexport EDITOR=vim\nPS1="[\\u@\\h \\W]\\$ "',
    'notes.txt':'- installer cowsay (sudo pacman -S cowsay)\n- lire le wiki : Alt+W\n- ne jamais dire "Ubuntu" ici',
    projects:{'hello.sh':'#!/bin/bash\necho "I use Arch btw"'},
    Applications:{'nova.ai':'Nova IA : assistant intelligent intégré.\nLancer : commande `ai` / `nova`, Alt+S, ou le dock.'}
  }},
  etc:{'os-release':'NAME="Arch Linux"\nPRETTY_NAME="Arch Linux"\nID=arch\nBUILD_ID=rolling\nHOME_URL="https://archlinux.org/"','hostname':'archweb','motd':'Welcome to archweb.'},
  usr:{bin:{}},var:{log:{'pacman.log':'[PACMAN] Running \'pacman -Syu\''}},tmp:{}
};
const FSK='archweb.fs.v1',FS0=JSON.stringify(fs);
const persist=()=>{try{localStorage.setItem(FSK,JSON.stringify(fs))}catch(e){}};
try{const sv=JSON.parse(localStorage.getItem(FSK)||'null');if(sv&&typeof sv==='object'){for(const k in fs)delete fs[k];Object.assign(fs,sv)}}catch(e){}
addEventListener('beforeunload',persist);
const get=p=>{let n=fs;for(const k of p){if(typeof n!=='object'||!(k in n))return;n=n[k]}return n};
const norm=(path,cwd)=>{
  if(path==='~'||path.startsWith('~/'))path='/home/user'+path.slice(1);
  const out=path.startsWith('/')?[]:[...cwd];
  for(const s of path.split('/')){if(!s||s==='.')continue;s==='..'?out.pop():out.push(s)}
  return out;
};

/* ---------- paquets ---------- */
const REPO={cowsay:'Configurable talking cow',sl:'Steam locomotive',htop:'Interactive process viewer',btop:'Resource monitor',
  'fortune-mod':'Fortune cookie program',vim:'Vi Improved text editor',git:'Distributed version control',firefox:'Web browser','i3-wm':'Tiling window manager'};

const FORT=["Arch is not hard. You are just lazy.","RTFM. Then read the wiki again.","It works on my machine. Because it is Arch.","rm -rf your_doubts","There is no cloud, just someone else's Arch."];
const LOGO=`
   ██████████████████

   ████

   ██████████████
   ████

/* ---------- sons (Web Audio, rien à télécharger) ---------- */
let AC=null,SND=true,Q=false;
try{SND=localStorage.getItem('snd')!=='0'}catch(e){}
const actx=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC};
function tone(f,d=.1,type='sine',v=.06,at=0,slide=0){
  if(!SND)return;const c=actx();if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),n=c.currentTime+at;
  o.type=type;o.frequency.setValueAtTime(f,n);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),n+d);
  g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g).connect(c.destination);o.start(n);o.stop(n+d+.02);
}
const SFX={
  open:()=>{tone(420,.14,'sine',.06,0,260);tone(840,.12,'sine',.03,.04)},
  close:()=>tone(520,.16,'sine',.05,0,-260),
  min:()=>tone(600,.22,'triangle',.05,0,-420),
  restore:()=>tone(240,.2,'triangle',.05,0,380),
  max:()=>{tone(440,.08,'sine',.05);tone(660,.1,'sine',.05,.07)},
  click:()=>tone(900,.04,'square',.02),
  key:()=>tone(1400+Math.random()*300,.025,'square',.012),
  err:()=>{tone(180,.18,'sawtooth',.05);tone(150,.2,'sawtooth',.05,.12)},
  ok:()=>{tone(660,.1,'sine',.05);tone(990,.18,'sine',.05,.09)},
  lc:()=>tone(500,.12,'sine',.04,0,200),
  boot:()=>[392,523,659,784].forEach((f,i)=>tone(f,.55,'sine',.05,i*.14))
};
const sfx=k=>{if(Q)return;try{SFX[k]()}catch(e){}};
const snd=v=>{SND=v;try{localStorage.setItem('snd',v?'1':'0')}catch(e){}document.querySelectorAll('#snd,#tksnd').forEach(b=>b.classList.toggle('off',!v));if(v)sfx('ok')};
$('#snd').classList.toggle('off',!SND);$('#snd').onclick=()=>snd(!SND);

/* ---------- Lumen : marque, icônes, apps ---------- */
const MARK='<svg class="mk" viewBox="0 0 32 32"><path d="M16 2l12 7v14l-12 7-12-7V9z" fill="none" stroke="url(#gm)" stroke-width="2.2" stroke-linejoin="round"/><path d="M21.5 9H11.5V23H21.5M11.5 16H19.5" fill="none" stroke="#ff3d9a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const APPS={term:{n:'Terminal',c:['#2dd4bf','#0f766e']},files:{n:'Fichiers',c:['#fbbf24','#d97706']},store:{n:'Pacstore',c:['#60a5fa','#2563eb']},btop:{n:'Moniteur',c:['#f472b6','#be185d']},wiki:{n:'Wiki',c:['#a78bfa','#6d28d9']},set:{n:'Réglages',c:['#94a3b8','#475569']},ai:{n:'Forge',c:['#e8a54b','#9a5b1a']},orbit:{n:'Scope',c:['#6b8f71','#2d4a34']}};
const GL={term:'<path d="M11 14l7 6-7 6M21 27h9"/>',files:'<path d="M8 13h9l3 3h12v13H8z"/>',store:'<path d="M10 16l10-5 10 5v10l-10 5-10-5zM10 16l10 5 10-5M20 21v10"/>',btop:'<path d="M11 28V20M17 28V12M23 28V17M29 28V9"/>',wiki:'<path d="M10 12h9a3 3 0 013 3v15a3 3 0 00-3-3h-9zM30 12h-8v18a3 3 0 013-3h5z"/>',set:'<path d="M10 14h20M10 20h20M10 26h20"/><circle cx="16" cy="14" r="2.4"/><circle cx="25" cy="20" r="2.4"/><circle cx="14" cy="26" r="2.4"/>',ai:'<path d="M14 26l8-8 4 4-8 8H14v-4z"/><path d="M24 14l3-3 3 3-3 3"/><path d="M12 28h6"/>',orbit:'<path d="M8 28V12h4v16M16 28V8h4v20M24 28V16h4v12"/><path d="M8 28h20"/>'};
document.body.insertAdjacentHTML('afterbegin','<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff2e93"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>'+Object.entries(APPS).map(([k,a])=>`<linearGradient id="g-${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a.c[0]}"/><stop offset="1" stop-color="${a.c[1]}"/></linearGradient>`).join('')+'</defs></svg>');

function dock(){
  const all=ALL();
  const key=all.map(w=>w.id+':'+w.type+':'+w.title+':'+(w.min?'m':'')+(w===focus&&!w.min?'f':'')).join('|');
  if(dock._k===key&&$('#tkapps').children.length)return;dock._k=key;
  const run=k=>all.some(w=>w.type===k);
  $('#tkapps').innerHTML=Object.keys(APPS).map(k=>`<div class="tq${run(k)?' run':''}" data-app="${k}" title="${APPS[k].n}">${ico(k,28)}</div>`).join('');

function mkFiles(bd,w){
  setTitle(w,'Fichiers');bd.className='bd app';let cwd=['home','user'],sel=null;
  const side=[['Dossier perso',['home','user']],['Projets',['home','user','projects']],['etc',['etc']],['var',['var']],['Racine',[]]];
  const draw=()=>{
    const n=get(cwd),names=Object.keys(n).sort((a,b)=>(typeof n[b]==='object')-(typeof n[a]==='object')||a.localeCompare(b));
    bd.innerHTML=`<div class="fm"><div class="fs">${side.map(([l,p])=>`<div class="fi${p.join('/')===cwd.join('/')?' on':''}" data-p="${p.join('/')}">${FOLD}${l}</div>`).join('')}</div>
    <div class="fl"><div class="fp"><span class="up" data-p="${cwd.slice(0,-1).join('/')}">↑</span>/${cwd.join('/')}</div>${names.map(k=>`<div class="fe${sel===k?' on':''}" data-k="${esc(k)}">${typeof n[k]==='object'?FOLD:FILE}${esc(k)}</div>`).join('')}</div>
    <div class="fv">${sel&&typeof n[sel]==='string'?'<b>'+esc(sel)+'</b>\n\n'+esc(n[sel]):'<span class="d">Sélectionne un fichier</span>'}</div></div>`;
  };

function mkOrbit(bd,w){
  setTitle(w,'Scope');bd.className='bd app';
  bd.style.cssText='padding:0;display:flex;flex-direction:column;min-height:0;height:100%';
  const hist=[];
  bd.innerHTML=`<div class="ai-wrap orbit">
    <div class="ai-head"><i class="dot"></i><div><b>Scope</b><span> · moniteur système · local</span></div><div class="ai-meta" id="ormeta">prêt</div></div>
    <div class="ai-log" id="orlog"></div>
    <div class="ai-sug" id="orsug"></div>
    <div class="ai-foot"><textarea id="orin" rows="1" placeholder="Orbit écoute… perf, btop, session sys"></textarea><button id="orsend">Envoyer</button></div>
  </div>`;
  const log=bd.querySelector('#orlog'), inp=bd.querySelector('#orin'), send=bd.querySelector('#orsend'), sug=bd.querySelector('#orsug'), meta=bd.querySelector('#ormeta');
  const fmt=t=>esc(t).replace(/\n/g,'<br>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const add=(role,text,cls='')=>{
    const d=document.createElement('div');d.className='ai-msg '+role+(cls?' '+cls:'');
    if(role==='bot')d.innerHTML='<span class="tag">scope</span><div class="body">'+fmt(text)+'</div>';
    else d.textContent=text;
    log.append(d);log.scrollTop=log.scrollHeight;return d;
  };
  const typewrite=async(el,text)=>{
    const body=el.querySelector('.body')||el;let out='';
    for(const part of text.split(/(\s+)/)){
      out+=part;body.innerHTML=fmt(out);log.scrollTop=log.scrollHeight;
      await new Promise(r=>setTimeout(r, part.trim()?12+Math.random()*16:3));
    }
  };
  const runAction=act=>{
    if(!act)return;
    if(String(act).startsWith('plan:')){
      const steps=act.slice(5).split(',');
      orbitBusy(true);orbitSay('Scan · '+steps.length+' étapes');
      steps.forEach((step,i)=>setTimeout(()=>runAction(step.trim()),i*420));
      setTimeout(()=>{orbitBusy(false);orbitSay('Scan terminé ✓')},steps.length*420+400);
      toast('Orbit · '+steps.length+' étapes');return;
    }
    if(act==='lumen'){setMode('win');toast('Lumen')}
    else if(act==='arch'){setMode('tile');toast('Arch')}
    else if(act==='term')spawn('term');
    else if(act==='btop')spawn('btop');
    else if(act==='wiki')spawn('wiki');
    else if(act==='files'){setMode('win');spawn('files')}
    else if(act==='diag'){spawn('btop');spawn('term')}
  };
  const reply=async(q)=>{
    send.disabled=true;inp.disabled=true;meta.textContent='analyse…';
    const thinking=add('bot','…','think');
    await new Promise(r=>setTimeout(r,200+Math.random()*320));
    const res=orbitThink(q,hist);
    const a=typeof res==='string'?res:res.text;
    const act=typeof res==='object'?res.act:null;
    hist.push({q,a});if(hist.length>30)hist.shift();
    thinking.remove();
    const el=add('bot','');await typewrite(el,a);
    if(act){
      const bar=document.createElement('div');bar.className='ai-actions';
      const b=document.createElement('button');b.type='button';b.textContent='Exécuter';
      b.onclick=()=>runAction(act);bar.append(b);el.append(bar);
      if(String(act).startsWith('plan:')||act==='btop'||act==='diag') setTimeout(()=>runAction(act),350);
    }
    meta.textContent='sys · '+hist.length+' échg.';
    send.disabled=false;inp.disabled=false;inp.focus();
  };
  const go=()=>{
    const q=inp.value.trim();if(!q||send.disabled)return;
    inp.value='';inp.style.height='44px';add('user',q);reply(q);
  };
  send.onclick=go;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});
  inp.addEventListener('input',()=>{inp.style.height='44px';inp.style.height=Math.min(140,inp.scrollHeight)+'px'});
  const tips=['Statut système','Ouvre btop','Diagnostic','Session perf','Qui es-tu ?','Aide Orbit'];
  sug.innerHTML=tips.map(t=>`<button type="button">${t}</button>`).join('');
  sug.onclick=e=>{const b=e.target.closest('button');if(!b)return;inp.value=b.textContent;go()};
  const cores=navigator.hardwareConcurrency||4;
  add('bot','Scope online — moniteur système.\nThreads : '+cores+' · RAM navigateur : '+(navigator.deviceMemory!=null?navigator.deviceMemory+" Go":'n/d')+'.\nBase : perf, réseau, sécu, diagnostic.\nEssaie « statut », « diagnostic », « cpu ».');
  setTimeout(()=>inp.focus(),200);
}

const hCalc=t=>{
  let e=t.replace(/divise par|divise|sur/g,'/').replace(/multiplie par|fois|x|×/g,'*').replace(/plus/g,'+').replace(/moins/g,'-').replace(/÷/g,'/').replace(/,/g,'.').replace(/(\d)\s*%\s*de\s*(\d)/g,'$1/100*$2');
  e=e.replace(/^.*?(combien (?:font|fait|ca fait)|calcule|resultat de|=)\s*/,'').replace(/[?=\s]+$/,'');
  if(!/^[\d\s+\-*/().%]+$/.test(e)||!/\d\s*[-+*/%]\s*[\d(]/.test(e))return null;
  try{const r=Function('"use strict";return('+e+')')();if(typeof r!=='number'||!isFinite(r))return null;return String(Math.round(r*1e10)/1e10)}catch(_){return null}
};

function humanTalk(q,who,hist){
  const t=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['’`]/g,' ').replace(/\s+/g,' ').trim();
  if(!t||t.length>140)return null;
  const c={q,t,who,hist:hist||[],name:hName(),v:(n,o)=>who==='nova'?n:o};
  const calc=hCalc(t);if(calc!==null)return t+' → '+calc;
  for(const [re,ans] of HUMAN){
    if(!ans||!re.test(t))continue;
    const r=typeof ans==='function'?ans(c):Array.isArray(ans)?hPick(ans):ans;
    if(r)return r;
  }
  return null;
}
function orbitThink(q,hist){
  const t=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const has=(...ks)=>ks.some(k=>t.includes(k));
  const cores=navigator.hardwareConcurrency||'?';
  const on=navigator.onLine?'oui':'non';
  const mem=(navigator.deviceMemory!=null)?navigator.deviceMemory+' Go (approx)':'n/d';
  const up=Math.floor(performance.now()/1000);
  const plat=navigator.platform||'?';
  const lang=navigator.language||'?';
  const _h=humanTalk(q,'orbit',hist);if(_h)return _h;

  if(has('diagnostic','diag','check system','verifie','vérifie'))
    return {text:'Diagnostic Orbit : btop + terminal.',act:'plan:btop,term'};
  if(has('session perf','mode perf','performance'))
    return {text:'Session perf : Lumen + btop + terminal.',act:'plan:lumen,btop,term'};
  if(has('ouvre btop','moniteur','lance btop'))
    return {text:'btop.',act:'btop'};
  if(has('ouvre terminal','shell'))
    return {text:'Terminal sys.',act:'term'};
  if(has('ouvre lumen','mode lumen'))
    return {text:'Lumen.',act:'lumen'};

function mkAI(bd,w){

  const runAction=act=>{
    if(!act)return;
    if(String(act).startsWith('plan:')){
      const steps=act.slice(5).split(',');
      novaBusy(true);novaSay('Plan · '+steps.length+' étapes…',2000);
      steps.forEach((step,i)=>setTimeout(()=>runAction(step.trim()),i*420));

  setTimeout(()=>inp.focus(),200);
}

/* ---------- fenêtres tilées ---------- */
const WS=[[],[],[],[]];let cur=0,focus=null,uid=0,mode='tile',Z=1;const ALL=()=>WS.flat();

function tile(){
  if(mode==='win')return tileWin();
  const area=$('#area'),ws=WS[cur],n=ws.length,W=area.clientWidth,H=area.clientHeight,g=6;
  document.querySelectorAll('.win').forEach(e=>e.style.display='none');
  ws.forEach((w,i)=>{
    let x=0,y=0,ww=W,hh=H;
    if(W<700){hh=(H-g*(n-1))/n;y=i*(hh+g)}
    else if(n>1){
      if(i===0){ww=Math.floor(W*.55)-g/2}
      else{const m=n-1;hh=(H-g*(m-1))/m;x=Math.floor(W*.55)+g/2;y=(i-1)*(hh+g);ww=W-x}
    }
    Object.assign(w.el.style,{display:'flex',left:x+'px',top:y+'px',width:ww+'px',height:hh+'px'});
    w.el.classList.toggle('f',w===focus);
  });
  $('#wss').innerHTML=WS.map((l,i)=>`<span class="w${i===cur?' on':''}${l.length?' has':''}" data-ws="${i}">${i+1}</span>`).join('');
  $('#ttl').textContent=focus?focus.title:'archweb';
  if(focus&&focus.term)focus.term.inp.focus();
}
function tileWin(){
  const area=$('#area'),W=area.clientWidth,H=area.clientHeight,all=ALL();
  document.querySelectorAll('.win:not(.closing):not(.minimizing)').forEach(e=>e.style.display='none');
  all.forEach((w,i)=>{
    if(!w.init){
      const k=i%6;
      Object.assign(w.el.style,{left:Math.max(0,Math.min(90+k*28,W-220))+'px',top:20+k*28+'px',width:Math.min((w.type==='ai'||w.type==='orbit')?720:520,W-12)+'px',height:Math.min((w.type==='ai'||w.type==='orbit')?520:340,H-40)+'px'});
      w.init=true;w.max=false;
    }
    w.el.style.display=w.min?'none':'flex';
    if(w._rs&&!w.min){w._rs=0;w.el.classList.add('restoring');setTimeout(()=>w.el.classList.remove('restoring'),380)}
    w.el.style.zIndex=w.z||1;
    w.el.classList.toggle('f',w===focus&&!w.min);
  });
  $('#wss').innerHTML='<span class="w start" data-start>'+MARK+'<b>Lumen</b></span>';
  $('#ttl').textContent=focus&&!focus.min?focus.title:'Bureau';
  dock();
  if(focus&&focus.term&&!focus.min)focus.term.inp.focus();
}
function setTitle(w,t){w.title=t;w.el.querySelector('.tt').textContent=t;if(mode==='win')tile();else if(w===focus)$('#ttl').textContent=t}
function closeWin(w){
  for(const l of WS){const i=l.indexOf(w);if(i>-1)l.splice(i,1)}
  // Synapse reste en daemon : on détache l'iframe, on ne la détruit pas
  w.stop&&w.stop();
  sfx('close');focus=(mode==='win'?ALL().filter(x=>!x.min).at(-1):WS[cur][0])||null;
  if(mode==='win'&&w.el.style.display!=='none'){w.el.classList.add('closing');setTimeout(()=>w.el.remove(),230)}else w.el.remove();
  tile();dock();
}
function switchWs(n){cur=n;focus=WS[n][0]||null;tile()}
function moveTo(n){
  if(!focus||n===cur)return;
  WS[cur].splice(WS[cur].indexOf(focus),1);WS[n].push(focus);

const C={};
function mkTerm(bd,w){
  const t={cwd:['home','user'],hist:[],hi:0,busy:false,w};
  const out=document.createElement('div'),row=document.createElement('div');
  row.className='ln';
  const pr=document.createElement('span'),inp=document.createElement('input');
  inp.spellcheck=false;inp.autocapitalize='off';inp.autocomplete='off';
  row.append(pr,inp);bd.append(out,row);t.inp=inp;
  const dir=()=>{const j=t.cwd.join('/');return j==='home/user'?'~':j.startsWith('home/user/')?'~/'+j.slice(10):'/'+j};
  const prompt=()=>`<span class="g">[user</span><span class="d">@</span><span class="a">archweb</span> ${esc(dir())}<span class="g">]</span>$&nbsp;`;
  t.p=(s='',c='')=>{const d=document.createElement('div');d.innerHTML=c?`<span class="${c}">${esc(s)}</span>`:esc(s);out.append(d);bd.scrollTop=bd.scrollHeight};
  t.h=h=>{const d=document.createElement('div');d.innerHTML=h;out.append(d);bd.scrollTop=bd.scrollHeight};
  t.clear=()=>{out.innerHTML=''};
  t.dir=dir;
  const refresh=()=>{pr.innerHTML=prompt();setTitle(w,'user@archweb: '+dir())};
  t.refresh=refresh;refresh();
  bd.addEventListener('click',()=>{if(!getSelection().toString())inp.focus()});
  inp.addEventListener('keydown',async e=>{
    if(e.altKey)return;
    if(e.key.length===1&&!e.ctrlKey&&!e.metaKey)sfx('key');
    if(e.key==='Enter'){
      if(t.busy)return;
      const line=inp.value;inp.value='';
      t.h(prompt()+esc(line));
      if(line.trim()){t.hist.push(line);t.hi=t.hist.length;t.busy=true;
        try{await run(t,line)}catch(err){sfx('err');t.p('bash: '+err.message,'r')}
        t.busy=false}
      refresh();inp.focus();
    }else if(e.key==='ArrowUp'){e.preventDefault();if(t.hi>0)inp.value=t.hist[--t.hi]}
    else if(e.key==='ArrowDown'){e.preventDefault();inp.value=t.hi<t.hist.length-1?t.hist[++t.hi]:(t.hi=t.hist.length,'')}
    else if(e.key==='l'&&e.ctrlKey){e.preventDefault();t.clear()}
    else if(e.key==='Tab'){
      e.preventDefault();
      const parts=inp.value.split(/\s+/),last=parts.pop(),first=parts.length===0;
      const pool=first?[...Object.keys(C)]:Object.keys(get(t.cwd)||{});
      const m=pool.filter(x=>x.startsWith(last));
      if(m.length===1){inp.value=[...parts,m[0]].join(' ')+(first?' ':'')}
      else if(m.length>1)t.p(m.join('  '),'d');
    }
  });
  return t;
}

async function run(t,line){
  const toks=[...line.matchAll(/"([^"]*)"|'([^']*)'|(\S+)/g)].map(m=>m[1]??m[2]??m[3]);
  let root=false;
  if(toks[0]==='sudo'){toks.shift();root=true}
  const cmd=toks.shift();if(!cmd)return;
  const fn=C[cmd];
  if(fn){try{await fn(toks,t,root)}finally{persist()}return}
  if(BIN[cmd]&&inst.has(BIN[cmd])){t.p(cmd+': ce programme est simulé dans le navigateur.','d');return}
  sfx('err');t.p(`bash: ${cmd}: command not found`);
}

      t.p(pre+(last?'└── ':'├── ')+k,isD?'a':'');isD?d++:f++;if(isD)w(n[k],pre+(last?'    ':'│   '))})};
    t.p(a[0]||'.');w(root,'');t.p(`\n${d} directories, ${f} files`)},

});

function novaBusy(on){const p=$('#novaPet');if(p)p.classList.toggle('busy',!!on)}
(function initNovaPet(){
  const p=$('#novaPet');if(!p)return;
  let drag=false,ox=0,oy=0,moved=false;
  p.addEventListener('pointerdown',e=>{
    if(e.button!=null&&e.button!==0)return;
    drag=true;moved=false;p.setPointerCapture(e.pointerId);
    const r=p.getBoundingClientRect(),desk=$('#desk').getBoundingClientRect();
    ox=e.clientX-r.left;oy=e.clientY-r.top;
  });
  p.addEventListener('pointermove',e=>{
    if(!drag)return;moved=true;
    const desk=$('#desk').getBoundingClientRect();
    let x=e.clientX-desk.left-ox,y=e.clientY-desk.top-oy;
    x=Math.max(8,Math.min(desk.width-96,x));
    y=Math.max(40,Math.min(desk.height-110,y));
    p.style.left=x+'px';p.style.top=y+'px';p.style.right='auto';p.style.bottom='auto';
  });
  p.addEventListener('pointerup',e=>{
    if(!drag)return;drag=false;
    try{p.releasePointerCapture(e.pointerId)}catch(err){}
    if(!moved){
      if(mode!=='win'){setMode('win');novaSay('Lumen activé ✨')}
      spawn('ai');novaSay('atelier prêt');
    }
  });
  setInterval(()=>{
    if(mode!=='win'||document.hidden)return;
    const _p=$('#novaPet');if(_p&&_p.classList.contains('show'))return;
    if(Math.random()>.72)novaSay(NOVA_LINES[Math.floor(Math.random()*NOVA_LINES.length)],2600);
  },14000);
})();


const ORBIT_LINES=['scope:~$ idle','threads: ok','./diagnostic','btop ready','scan…','sys nominal'];
function orbitSay(msg,ms=3400){
  const b=$('#orbitBubble'),p=$('#orbitPet');if(!b||!p)return;
  b.textContent=msg;p.classList.add('show');
  clearTimeout(orbitSay._t);orbitSay._t=setTimeout(()=>p.classList.remove('show'),ms);
}
function orbitBusy(on){const p=$('#orbitPet');if(p)p.classList.toggle('busy',!!on)}
(function initOrbitPet(){
  const p=$('#orbitPet');if(!p)return;
  let drag=false,ox=0,oy=0,moved=false;
  p.addEventListener('pointerdown',e=>{
    if(e.button!=null&&e.button!==0)return;
    drag=true;moved=false;p.setPointerCapture(e.pointerId);
    const r=p.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;
  });
  p.addEventListener('pointermove',e=>{
    if(!drag)return;moved=true;
    const desk=$('#desk').getBoundingClientRect();
    let x=e.clientX-desk.left-ox,y=e.clientY-desk.top-oy;
    x=Math.max(8,Math.min(desk.width-96,x));
    y=Math.max(40,Math.min(desk.height-110,y));
    p.style.left=x+'px';p.style.top=y+'px';p.style.right='auto';p.style.bottom='auto';
  });
  p.addEventListener('pointerup',e=>{
    if(!drag)return;drag=false;
    try{p.releasePointerCapture(e.pointerId)}catch(err){}
    if(!moved){
      if(mode!=='win'){setMode('win');orbitSay('Lumen · sys')}
      spawn('orbit');orbitSay('scope prêt');
    }
  });
  setInterval(()=>{
    if(mode!=='win'||document.hidden)return;
    const _p=$('#orbitPet');if(_p&&_p.classList.contains('show'))return;
    if(Math.random()>.78)orbitSay(ORBIT_LINES[Math.floor(Math.random()*ORBIT_LINES.length)],2400);
  },16000);
})();

/* ---------- boot ---------- */
let skip=false;
addEventListener('keydown',()=>skip=true);$('#boot').addEventListener('click',()=>skip=true);
const shotSkip=new URLSearchParams(location.search).get('shot');
if(shotSkip)skip=true;
(async()=>{
  const B=$('#boot');
  const L=['GRUB loading Arch Linux...','Loading Linux linux ...','Loading initial ramdisk ...','',
    ...['Mounted /boot.','Reached target Local File Systems.','Started Network Manager.','Started D-Bus System Message Bus.','Reached target Multi-User System.','Started archweb tiling manager.']
      .map(s=>'[<span class="ok">  OK  </span>] '+s),'','Arch Linux 6.12.0-arch1-1 (tty1)','','archweb login: user (autologin)'];
  for(const l of L){B.innerHTML+=l+'\n';if(skip)break;await sleep(l?170:60)}
  await sleep(skip?0:400);
  B.remove();$('#desk').hidden=false;$('#pk').textContent=inst.size+' pkgs';
  Q=true;const t1=spawn('term');spawn('wiki');focus=WS[0][0];tile();
  t1.term.inp.value='neofetch';t1.term.inp.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'}));Q=false;sfx('boot');
  const tickClk=()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};tickClk();setInterval(tickClk,1000);
  if(shotSkip){
    setTimeout(()=>{
      const m=shotSkip;
      if(m==='lumen'||m==='nova'||m==='orbit'||m==='agents')setMode('win');
      if(m==='nova'||m==='agents')spawn('ai');
      if(m==='orbit'||m==='agents')spawn('orbit');
    },200);
  }

  setTimeout(()=>t1.term.h('\n<span class="y">→ Forge : bouton « forge », pixel en Lumen, ou</span> <span class="a">forge</span>\n<span class="y">→ Bureau Lumen : bouton « Lumen » · dock · Alt+S</span>'),80);
})();

/* ---------- entrées globales ---------- */
addEventListener('keydown',e=>{
  if(!e.altKey)return;
  const c=e.code;let h=true;
  if(c==='Enter')spawn('term');
  else if(c==='KeyQ'&&e.shiftKey){focus&&closeWin(focus)}
  else if(/^Digit[1-4]$/.test(c)){const n=+c[5]-1;e.shiftKey?moveTo(n):switchWs(n)}
  else if(c==='KeyJ')cycle(1);
  else if(c==='KeyK')cycle(-1);
  else if(c==='KeyW')spawn('wiki');
  else if(c==='KeyB')spawn('btop');
  else if(c==='KeyS')spawn('ai');
  else if(c==='KeyM')setMode(mode==='win'?'tile':'win');
  else h=false;
  if(h)e.preventDefault();
});
$('#bar').addEventListener('click',e=>{
  const s=e.target.closest('[data-sp]'),w=e.target.closest('[data-ws]');
  if(s)spawn(s.dataset.sp);else if(w)switchWs(+w.dataset.ws);
});
function setMode(m){
  sfx('lc');mode=m;document.body.classList.toggle('winmode',m==='win');
  ALL().forEach(w=>{w.init=false;w.min=false});
  closeLC();$('#mode').textContent=m==='win'?'Arch':'Lumen';
  if(!ALL().includes(focus)||(m==='tile'&&!WS[cur].includes(focus)))focus=(m==='win'?ALL().at(-1):WS[cur][0])||null;
  tile();
}
function minimize(w){
  sfx('min');
  const fin=()=>{w.el.classList.remove('minimizing');w.min=true;focus=ALL().filter(x=>!x.min).at(-1)||null;tile()};
  const d=$(`#tk [data-win="${w.id}"]`)||$(`#tk [data-app="${w.type}"]`);
  if(mode!=='win'||!d)return fin();
  const r=w.el.getBoundingClientRect(),q=d.getBoundingClientRect(),st=w.el.style;
  st.setProperty('--tx',(q.left+q.width/2-r.left-r.width/2)+'px');
  st.setProperty('--ty',(q.top+q.height/2-r.top-r.height/2)+'px');
  w.el.classList.add('minimizing');setTimeout(fin,320);
}
function toggleMax(w){
  sfx('max');
  w.el.classList.add('tr');setTimeout(()=>w.el.classList.remove('tr'),380);
  const s=w.el.style,a=$('#area');
  if(!w.max){w.prev=[s.left,s.top,s.width,s.height];Object.assign(s,{left:'0px',top:'0px',width:a.clientWidth+'px',height:a.clientHeight+'px'});w.max=true}
  else{[s.left,s.top,s.width,s.height]=w.prev;w.max=false}
}
$('#area').addEventListener('pointerdown',e=>{
  if(mode!=='win')return;
  const tb=e.target.closest('.tb');if(!tb||e.target.closest('b'))return;
  const el=tb.parentElement,w=ALL().find(x=>x.el===el);if(!w||w.max)return;
  const sx=e.clientX-el.offsetLeft,sy=e.clientY-el.offsetTop;document.body.classList.add('dragging');
  const mv=ev=>{el.style.left=Math.max(0,ev.clientX-sx)+'px';el.style.top=Math.max(0,ev.clientY-sy)+'px'};
  const up=()=>{document.body.classList.remove('dragging');removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
});
const bounce=k=>requestAnimationFrame(()=>{const d=$(`#tk [data-app="${k}"]`);if(d){d.classList.add('bounce');setTimeout(()=>d.classList.remove('bounce'),900)}});
const openApp=k=>{
  const w=ALL().filter(x=>x.type===k).at(-1);
  if(!w){spawn(k);bounce(k);return}
  if(w.min){w.min=false;w._rs=1;focus=w;sfx('restore')}
  else if(focus===w){minimize(w);return}
  else focus=w;
  w.z=++Z;tile();
};
let tkSD=[];
const closeLC=()=>$('#lc').classList.remove('open');
function fillLC(q){$('#lcg').innerHTML=Object.keys(APPS).filter(k=>APPS[k].n.toLowerCase().includes(q.toLowerCase())).map((k,i)=>`<div class="ap" style="animation-delay:${i*40}ms" data-app="${k}">${ico(k,60)}${APPS[k].n}</div>`).join('')}
function openLC(){sfx('lc');const l=$('#lc'),i=l.querySelector('input');l.classList.add('open');i.value='';fillLC('');i.focus()}
$('#lc input').addEventListener('input',e=>fillLC(e.target.value));
$('#lc input').addEventListener('keydown',e=>{if(e.key==='Enter'){const a=$('#lcg .ap');if(a){closeLC();openApp(a.dataset.app)}}});
addEventListener('keydown',e=>{
  if(e.key==='Escape')closeLC();
  if(mode==='win'&&e.altKey&&e.code==='Space'){e.preventDefault();openLC()}
});
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#tk .tq,#tk .tt2,#tk button,#tk .tkstart,#tk #tksd,.ap,.di,#bar .b,#bar .w'))sfx('click');
  if(t.closest('#mode,#tkmode')){setMode(mode==='win'?'tile':'win');return}
  if(t.closest('[data-start],[data-lc]')){$('#lc').classList.contains('open')?closeLC():openLC();return}
  const tw=t.closest('#tk [data-win]');
  if(tw){closeLC();const w=ALL().find(x=>x.id==tw.dataset.win);if(w){
    if(w.min){w.min=false;w._rs=1;focus=w;w.z=++Z;sfx('restore');tile()}
    else if(focus===w){minimize(w)}
    else{focus=w;w.z=++Z;tile()}}return}
  if(t.closest('#tksd')){closeLC();const vis=ALL().filter(x=>!x.min);
    if(vis.length){tkSD=vis;vis.forEach(w=>w.min=true);focus=null;sfx('min')}
    else if(tkSD.length){tkSD.filter(w=>ALL().includes(w)).forEach(w=>{w.min=false;w._rs=1});focus=tkSD.at(-1);sfx('restore');tkSD=[]}
    tile();return}
  const a=t.closest('#dock [data-app],#tk [data-app],#lc [data-app],#dsk [data-app]');
  if(a){closeLC();openApp(a.dataset.app);return}
  if(t.id==='lc')closeLC();
});
$('#dock').addEventListener('mousemove',e=>{document.querySelectorAll('#dock .dk').forEach(d=>{const q=d.getBoundingClientRect(),k=1+.6*Math.max(0,1-Math.abs(e.clientX-(q.left+q.width/2))/120)**2;d.style.transform=`translateY(${-(k-1)*20}px) scale(${k})`})});
$('#dock').addEventListener('mouseleave',()=>document.querySelectorAll('#dock .dk').forEach(d=>d.style.transform=''));
$('#dsk').innerHTML=`<div class="di" data-app="ai">${ico('ai',60)}Forge</div><div class="di" data-app="orbit" style="margin-top:8px">${ico('orbit',60)}Scope</div>`;
addEventListener('blur',()=>setTimeout(()=>{const a=document.activeElement;if(a&&a.tagName==='IFRAME'){const w=ALL().find(x=>x.el.contains(a));if(w&&(focus!==w||w.z!==Z)){focus=w;w.z=++Z;tile()}}}));
if(navigator.getBattery)navigator.getBattery().then(b=>{const f=()=>$('#bat').textContent='BAT '+Math.round(b.level*100)+'%';f();b.onlevelchange=f}).catch(()=>{});
addEventListener('resize',tile);
const clk=()=>{$('#clk').textContent=new Date().toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
clk();setInterval(clk,15000);
const tkTick=()=>{const d=new Date(),c=$('#tkclk');if(!c)return;c.querySelector('b').textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});c.querySelector('small').textContent=d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});const b=$('#bat');$('#tkbat').textContent=b?b.textContent:''};
tkTick();setInterval(tkTick,5000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
